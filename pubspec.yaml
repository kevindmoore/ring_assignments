name: ring_assignments
description: "ATA Ring Assignment App"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.9
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  signals: ^7.1.0
  auto_route: ^11.1.0
  # Logging
  lumberdash: ^3.0.0
  colorize_lumberdash: ^3.0.0
  file_selector: ^1.1.0
  speech_to_text: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  freezed: ^3.2.5
  build_runner: ^2.15.0
  json_serializable: ^6.14.0
  auto_route_generator: ^10.5.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:

  uses-material-design: true
  assets:
    - sample_competitors.csv
    - sample_judges.csv

flutter_launcher_icons:
  image_path: assets/branding/ring_assignments_brand.png
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
  windows:
    generate: true
  macos:
    generate: true

flutter_native_splash:
  color: "#001B3F"
  image: assets/branding/ring_assignments_splash.png
  android_12:
    color: "#001B3F"
    image: assets/branding/ring_assignments_splash.png
